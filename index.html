
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지역별 여행지 카드북</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f3f7fa;
  font-family: Arial, sans-serif;
  color: #253746;
}

header {
  text-align: center;
  padding: 40px 20px;
  background: linear-gradient(120deg, #176b92, #20a4ac);
  color: white;
}

header h1 {
  margin: 0 0 12px;
}

main {
  max-width: 1100px;
  margin: 30px auto;
  padding: 0 20px;
}

.search-box {
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 4px 15px #00000012;
}

select {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 9px;
  background: white;
}

#status {
  margin: 20px 0;
  color: #526779;
  line-height: 1.6;
}

#resultSection[hidden] {
  display: none;
}

#resultSection h2 {
  margin: 25px 0 15px;
}

#cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 20px;
}

.card {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 4px 12px #00000012;
}

.card img {
  width: 100%;
  height: 185px;
  object-fit: cover;
  display: block;
}

.card-content {
  padding: 16px;
}

.card-content h3 {
  font-size: 17px;
  margin: 0 0 10px;
}

.card-content p {
  color: #667;
  font-size: 14px;
  line-height: 1.5;
}

footer {
  text-align: center;
  margin-top: 50px;
  padding: 20px;
  color: #777;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1>지역별 여행지 카드북</h1>
  <p>대한민국의 아름다운 여행지를 찾아보세요!</p>
</header>

<main>
  <div class="search-box">
    <h2>여행 지역 선택</h2>

    <select id="regionSelect">
      <option value="">지역을 선택하세요</option>
      <option value="11">서울</option>
      <option value="26">부산</option>
      <option value="27">대구</option>
      <option value="28">인천</option>
      <option value="29">광주</option>
      <option value="30">대전</option>
      <option value="31">울산</option>
      <option value="36">세종</option>
      <option value="41">경기</option>
      <option value="51">강원</option>
      <option value="43">충북</option>
      <option value="44">충남</option>
      <option value="52">전북</option>
      <option value="46">전남</option>
      <option value="47">경북</option>
      <option value="48">경남</option>
      <option value="50">제주</option>
    </select>
  </div>

  <p id="status">Firebase 정보를 확인하는 중...</p>

  <section id="resultSection" hidden>
    <h2 id="regionTitle"></h2>
    <div id="cards"></div>
  </section>
</main>

<footer>
  관광정보 출처: 한국관광공사 TourAPI
</footer>

<script type="module">

// ======================================
// 1. Firebase 불러오기
// ======================================

import { initializeApp } from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc
} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


// ======================================
// 2. Firebase 설정
// 반드시 네 실제 설정으로 변경!
// ======================================

const firebaseConfig = {
  apiKey: "AIzaSyCCkTrk8fPC0JyoNZZsom_XKTLIwl2aVPI",
  authDomain: "my-project-4c69a.firebaseapp.com",
  projectId: "my-project-4c69a",
  storageBucket: "my-project-4c69a.firebasestorage.app",
  messagingSenderId: "591292535195",
  appId: "1:591292535195:web:26a965e19d0884a16d513e",
  measurementId: "G-50DXVDFT4V"
};


// ======================================
// 3. 공공데이터 API 인증키
// 반드시 네 실제 일반 인증키로 변경!
// ======================================

const TOUR_API_KEY = "b2680cd2ac01f99af0441a9f4429e3aef3a48529e4f7a27c3ad3f44b9a978435";


// ======================================
// 4. Firebase 연결
// ======================================

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const regionSelect =
  document.getElementById("regionSelect");

const statusEl =
  document.getElementById("status");

const resultSection =
  document.getElementById("resultSection");

const regionTitle =
  document.getElementById("regionTitle");

const cards =
  document.getElementById("cards");

const savedRef =
  doc(db, "travelCardbook", "latest");

const regions = {
  "11": "서울",
  "26": "부산",
  "27": "대구",
  "28": "인천",
  "29": "광주",
  "30": "대전",
  "31": "울산",
  "36": "세종",
  "41": "경기",
  "51": "강원",
  "43": "충북",
  "44": "충남",
  "52": "전북",
  "46": "전남",
  "47": "경북",
  "48": "경남",
  "50": "제주"
};


// ======================================
// 5. 관광정보 카드 표시
// ======================================

function showCards(data) {

  if (!data) {
    resultSection.hidden = true;
    cards.replaceChildren();

    statusEl.textContent =
      "저장된 여행지가 없어요. 지역을 선택해 주세요.";

    return;
  }

  regionSelect.value = data.regionCode;

  regionTitle.textContent =
    data.regionName + " 관광지";

  cards.replaceChildren();

  const items = Array.isArray(data.items)
    ? data.items
    : [];

  items.forEach(item => {

    const card = document.createElement("div");
    card.className = "card";

    const image = document.createElement("img");
    image.src = item.image;
    image.alt = item.title;
    image.loading = "lazy";

    const content =
      document.createElement("div");

    content.className = "card-content";

    const title = document.createElement("h3");
    title.textContent = item.title;

    const address = document.createElement("p");
    address.textContent = item.address;

    content.append(title, address);
    card.append(image, content);
    cards.append(card);

  });

  resultSection.hidden = false;

  statusEl.textContent =
    data.regionName + " 관광정보 " +
    items.length + "개를 표시했어요.";
}


// ======================================
// 6. Firebase 저장 정보 불러오기
// ======================================

async function loadSavedData() {

  try {

    const snapshot = await getDoc(savedRef);

    if (snapshot.exists()) {
      showCards(snapshot.data());
    } else {
      showCards(null);
    }

  } catch (error) {

    console.error(error);

    statusEl.textContent =
      "Firebase 불러오기 실패: " + error.message;

  }
}


// ======================================
// 7. 공공데이터 API 요청
// ======================================

async function getTourData(regionCode) {

  const url = new URL(
    "https://apis.data.go.kr/B551011/KorService2/areaBasedList2"
  );

  url.searchParams.set(
    "serviceKey",
    TOUR_API_KEY.trim()
  );

  url.searchParams.set("MobileOS", "WEB");
  url.searchParams.set("MobileApp", "TravelCardbook");
  url.searchParams.set("_type", "json");
  url.searchParams.set("numOfRows", "18");
  url.searchParams.set("pageNo", "1");
  url.searchParams.set("arrange", "O");
  url.searchParams.set("contentTypeId", "12");
  url.searchParams.set("lDongRegnCd", regionCode);

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error(
      "관광정보 API HTTP 오류: " + response.status
    );
  }

  const result = await response.json();

  const header = result.response?.header;

  if (
    !header ||
    String(header.resultCode) !== "0000"
  ) {
    throw new Error(
      header?.resultMsg || "공공데이터 API 오류"
    );
  }

  const rawItems =
    result.response?.body?.items?.item || [];

  const list = Array.isArray(rawItems)
    ? rawItems
    : [rawItems];

  const items = list
    .map(item => ({
      title: item.title || "이름 없음",
      address: item.addr1 || "주소 정보 없음",
      image: (
        item.firstimage ||
        item.firstimage2 ||
        ""
      ).replace(/^http:\/\//, "https://")
    }))
    .filter(item => item.image);

  return items;
}


// ======================================
// 8. 지역 선택 후 관광정보 저장
// ======================================

regionSelect.addEventListener(
  "change",
  async function () {

    const regionCode = regionSelect.value;

    if (!regionCode) return;

    regionSelect.disabled = true;

    statusEl.textContent =
      "관광정보를 불러오는 중...";

    try {

      // 공공데이터 조회
      const items =
        await getTourData(regionCode);

      // Firebase 저장 데이터
      const data = {
        regionCode: regionCode,
        regionName: regions[regionCode],
        items: items,
        updatedAt: Date.now()
      };

      // Firestore 저장
      await setDoc(savedRef, data);

      // 화면 표시
      showCards(data);

    } catch (error) {

      console.error(error);

      statusEl.textContent =
        "오류: " + error.message;

    } finally {

      regionSelect.disabled = false;

    }
  }
);


// ======================================
// 9. 처음 접속 시 저장 데이터 복원
// ======================================

loadSavedData();

</script>

</body>
</html>
